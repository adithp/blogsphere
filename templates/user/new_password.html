{% extends 'user/loginbase.html' %}

{% block logincontent %}

<body class="bg-background-light dark:bg-background-dark">
    <div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden"
        style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col">
            <div class="flex flex-1 justify-center py-5">
                <div class="layout-content-container flex flex-col w-full max-w-[960px] flex-1">
                    <header class="flex items-center justify-between whitespace-nowrap px-4 sm:px-10 py-3">
                        <div class="flex items-center gap-4 text-slate-900 dark:text-slate-50">
                            <div class="size-6 text-primary">
                                <svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                                    <path clip-rule="evenodd"
                                        d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z"
                                        fill="currentColor" fill-rule="evenodd"></path>
                                </svg>
                            </div>
                            <a href="{% url 'home_page' %}">
                                <h2
                                    class="text-slate-900 dark:text-slate-50 text-lg font-bold leading-tight tracking-[-0.015em]">
                                    BlogSphere</h2>
                            </a>
                        </div>
                    </header>
                    <main class="flex-grow flex items-center justify-center p-4">
                        <div
                            class="w-full max-w-md mx-auto bg-white dark:bg-slate-900 rounded-xl shadow-lg p-6 sm:p-8 space-y-6">
                            <div class="flex flex-col gap-2 text-center">
                                <p
                                    class="text-slate-900 dark:text-slate-50 text-3xl sm:text-4xl font-black leading-tight tracking-[-0.033em]">
                                    Set a New Password</p>

                            </div>
                            <form class="space-y-6" method="POST" action="">
                                {% csrf_token %}
                                <input type="hidden" name="token" value="{{ request.GET.token }}">
                                <div class="flex flex-col">
                                    <label class="flex flex-col w-full flex-1">
                                        <p
                                            class="text-slate-900 dark:text-slate-50 text-base font-medium leading-normal pb-2">
                                            New Password</p>
                                        <div
                                            class="flex w-full flex-1 items-stretch rounded-lg border border-slate-300 dark:border-slate-700 focus-within:ring-2 focus-within:ring-primary focus-within:border-primary">
                                            <input
                                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-slate-900 dark:text-slate-50 focus:outline-0 focus:ring-0 border-0 bg-white dark:bg-slate-900 h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-4 text-base font-normal leading-normal"
                                                placeholder="Enter new password" type="password" value=""
                                                name="password" />
                                            <button aria-label="Toggle password visibility"
                                                class="text-slate-500 dark:text-slate-400 flex items-center justify-center pr-4"
                                                type="button">
                                                <span class="material-symbols-outlined">visibility</span>
                                            </button>
                                        </div>
                                    </label>
                                </div>
                                {% if error %}

                                <span class="form-error">
                                    <span class="material-symbols-outlined">error</span>
                                    {{error.password}}
                                </span>
                                {% endif %}

                                <div class="flex pt-2">
                                    <button
                                        class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-slate-50 text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background-light dark:focus:ring-offset-background-dark transition-colors duration-200">
                                        <span class="truncate">Set New Password</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>
</body>
{% endblock logincontent %}

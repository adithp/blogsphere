<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Password Reset Successful - BlogSphere</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1f89e5",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111a21",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 1,
                'wght' 400,
                'GRAD' 0,
                'opsz' 48
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <header class="w-full">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <a href="{% url 'home_page' %}">
                    <span class="text-xl font-bold text-slate-900 dark:text-slate-100">BlogSphere</span>
                </a>
            </div>
        </header>
        <main class="layout-container flex h-full grow flex-col">
            <div class="px-4 flex flex-1 justify-center items-center py-5">
                <div class="bg-white dark:bg-slate-900 shadow-lg rounded-xl p-6 sm:p-10 w-full max-w-md text-center">
                    <div class="flex justify-center mb-6">
                        <div class="w-20 h-20 rounded-full bg-primary/20 flex items-center justify-center">
                            <span class="material-symbols-outlined text-5xl text-primary">check</span>
                        </div>
                    </div>
                    <div class="layout-content-container flex flex-col flex-1">
                        <h1 class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold leading-tight pb-3">
                            Password Reset Successful!</h1>
                        <p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal pb-6 pt-1">
                            Your password has been updated. You can now log in with your new credentials.</p>
                        <div class="flex py-3 justify-center">
                            <button
                                class="flex w-full max-w-xs cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-slate-50 text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-slate-900 transition-colors">
                                <a href="{% url 'login' %}" class="truncate">Go to Login</a>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="w-full py-4">
            <p class="text-center text-sm text-slate-500 dark:text-slate-400">© 2024 BlogSphere. All Rights Reserved.
            </p>
        </footer>
    </div>
</body>

</html>

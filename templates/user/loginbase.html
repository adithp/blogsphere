<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign Up - BlogSphere</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .form-input:focus~.input-icon,
        .form-input:focus+.input-icon {
            color: #198ae6;
        }

        .form-input:focus {
            border-color: #198ae6;
            box-shadow: 0 0 0 2px rgba(25, 138, 230, 0.2);
        }

        .form-error {
            display: flex;
            align-items: center;
            font-size: 13px;
            margin-top: 8px;
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            padding: 8px 12px;
            border-radius: 6px;
            gap: 8px;
            font-weight: 500;
        }

        .form-error .material-symbols-outlined {
            font-size: 18px;
            flex-shrink: 0;
        }

        .form-input:focus~.input-icon,
        .form-input:focus+.input-icon {
            color: #198ae6;
        }

        .form-input:focus {
            border-color: #198ae6;
            box-shadow: 0 0 0 2px rgba(25, 138, 230, 0.2);

        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#198ae6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111a21",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-[#0e151b] dark:text-slate-50"></body>
{% block logincontent %}

{% endblock logincontent %}
</body>

</html>

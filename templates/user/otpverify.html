<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BlogSphere - OTP Verification</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .disabled-link {
            pointer-events: none;
            /* disables clicking */
            color: gray;
            /* make it look disabled */
            text-decoration: none;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1E88E5",
                        "background-light": "#F8F9FA",
                        "background-dark": "#111a21",
                    },
                    fontFamily: {
                        "display": ["Poppins", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-[#212529] dark:text-slate-200">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">
        <header class="absolute left-0 top-0 flex w-full items-center justify-between p-4 sm:p-6 lg:p-8">
            <div class="flex items-center gap-2">
                <div
                    class="flex items-center justify-center size-10 rounded-full transition-colors hover:bg-black/10 dark:hover:bg-white/10">
                    <a aria-label="Back to previous page" href="#">
                        <span
                            class="material-symbols-outlined text-2xl text-[#212529] dark:text-slate-200">arrow_back</span>
                    </a>
                </div>
            </div>
            <div class="flex items-center gap-2 text-lg font-semibold tracking-wide">
                <a href="{% url 'home_page' %}">
                    <svg class="h-6 w-6 text-primary" fill="none" viewbox="0 0 48 48"
                        xmlns="http://www.w3.org/2000/svg">
                        <path clip-rule="evenodd"
                            d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z"

                    </svg>
                    <span>BlogSphere</span>
                </a>
            </div>
        </header>
        <main class="w-full max-w-md">
            <div class="bg-white dark:bg-background-dark/80 backdrop-blur-sm rounded-xl shadow-lg p-6 sm:p-8">
                <div class="text-center mb-8">
                    <h1
                        class="text-[#212529] dark:text-slate-100 text-3xl sm:text-4xl font-semibold leading-tight tracking-tight">
                        Verify Your Email</h1>
                    <p class="text-[#6c757d] dark:text-slate-400 text-base font-normal leading-normal mt-2">Enter the
                        6-digit code we sent to your email.</p>
                </div>
                <form class="space-y-6" action="{% url 'otpverify' %}" method="POST">
                    {% csrf_token %}
                    <div class="flex justify-center">
                        <fieldset class="relative flex gap-2 sm:gap-3">
                            <input aria-label="first digit" name="otp1"
                                class="flex h-14 w-12 sm:h-16 sm:w-14 text-center text-xl font-semibold [appearance:textfield] focus:outline-none focus:ring-2 focus:ring-primary dark:bg-slate-800 dark:text-slate-200 rounded-lg border border-gray-300 dark:border-slate-700 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none"
                                max="9" maxlength="1" min="0" oninput="this.value=this.value.replace(/[^0-9]/g,'');"
                                onkeydown="javascript:(event.key=='Backspace'&amp;&amp;this.value===''&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowLeft'&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowRight'&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus());"
                                onkeyup="javascript:event.key.match(/^\d$/)&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus();"
                                type="text" value="" />
                            <input aria-label="second digit" name="otp2"
                                class="flex h-14 w-12 sm:h-16 sm:w-14 text-center text-xl font-semibold [appearance:textfield] focus:outline-none focus:ring-2 focus:ring-primary dark:bg-slate-800 dark:text-slate-200 rounded-lg border border-gray-300 dark:border-slate-700 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none"
                                max="9" maxlength="1" min="0" oninput="this.value=this.value.replace(/[^0-9]/g,'');"
                                onkeydown="javascript:(event.key=='Backspace'&amp;&amp;this.value===''&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowLeft'&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowRight'&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus());"
                                onkeyup="javascript:event.key.match(/^\d$/)&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus();"
                                type="text" value="" />
                            <input aria-label="third digit" name="otp3"
                                class="flex h-14 w-12 sm:h-16 sm:w-14 text-center text-xl font-semibold [appearance:textfield] focus:outline-none focus:ring-2 focus:ring-primary dark:bg-slate-800 dark:text-slate-200 rounded-lg border border-gray-300 dark:border-slate-700 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none"
                                max="9" maxlength="1" min="0" oninput="this.value=this.value.replace(/[^0-9]/g,'');"
                                onkeydown="javascript:(event.key=='Backspace'&amp;&amp;this.value===''&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowLeft'&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowRight'&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus());"
                                onkeyup="javascript:event.key.match(/^\d$/)&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus();"
                                type="text" value="" />
                            <input aria-label="fourth digit" name="otp4"
                                class="flex h-14 w-12 sm:h-16 sm:w-14 text-center text-xl font-semibold [appearance:textfield] focus:outline-none focus:ring-2 focus:ring-primary dark:bg-slate-800 dark:text-slate-200 rounded-lg border border-gray-300 dark:border-slate-700 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none"
                                max="9" maxlength="1" min="0" oninput="this.value=this.value.replace(/[^0-9]/g,'');"
                                onkeydown="javascript:(event.key=='Backspace'&amp;&amp;this.value===''&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowLeft'&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowRight'&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus());"
                                onkeyup="javascript:event.key.match(/^\d$/)&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus();"
                                type="text" value="" />
                            <input aria-label="fifth digit" name="otp5"
                                class="flex h-14 w-12 sm:h-16 sm:w-14 text-center text-xl font-semibold [appearance:textfield] focus:outline-none focus:ring-2 focus:ring-primary dark:bg-slate-800 dark:text-slate-200 rounded-lg border border-gray-300 dark:border-slate-700 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none"
                                max="9" maxlength="1" min="0" oninput="this.value=this.value.replace(/[^0-9]/g,'');"
                                onkeydown="javascript:(event.key=='Backspace'&amp;&amp;this.value===''&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowLeft'&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowRight'&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus());"
                                onkeyup="javascript:event.key.match(/^\d$/)&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus();"
                                type="text" value="" />
                            <input aria-label="sixth digit" name="otp6"
                                class="flex h-14 w-12 sm:h-16 sm:w-14 text-center text-xl font-semibold [appearance:textfield] focus:outline-none focus:ring-2 focus:ring-primary dark:bg-slate-800 dark:text-slate-200 rounded-lg border border-gray-300 dark:border-slate-700 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none"
                                max="9" maxlength="1" min="0" oninput="this.value=this.value.replace(/[^0-9]/g,'');"
                                onkeydown="javascript:(event.key=='Backspace'&amp;&amp;this.value===''&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowLeft'&amp;&amp;this.previousSibling&amp;&amp;this.previousSibling.focus())||(event.key==='ArrowRight'&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus());"
                                onkeyup="javascript:event.key.match(/^\d$/)&amp;&amp;this.nextSibling&amp;&amp;this.nextSibling.focus();"
                                type="text" value="" />
                        </fieldset>
                    </div>
                    <!-- Placeholder for Success Message -->
                    <!-- 
                    <div class="p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-50 dark:bg-gray-800 dark:text-green-400" role="alert">
                      <span class="font-medium">Success!</span> Email verified successfully!
                    </div>
                    -->
                    <!-- Placeholder for Error Message -->
                    <!-- 
                    <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
                      <span class="font-medium">Error!</span> Invalid OTP, please try again.
                    </div>
                     -->
                    <div>
                        <button
                            class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-semibold leading-normal tracking-wide shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark"
                            type="submit">
                            <span class="truncate">Verify</span>
                        </button>
                    </div>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-[#6c757d] dark:text-slate-400 text-sm font-normal leading-normal">Didn't receive the
                        code?<span id="count"></span> <button id="butt" onclick="Startcount()"
                            class="font-semibold text-primary hover:underline disabled-link">Resend
                            OTP</button></p>
                </div>
            </div>
        </main>
    </div>
</body>
<script>
    let countdown;
    let timeLeft = -1;
    function Startcount() {
        obj = document.getElementById('butt')
        obj.classList.remove('disabled-link')
        if (timeLeft == -1
        ) {


            timeLeft = 10
            countdown = setInterval(() => {
                const timer = document.getElementById('count').textContent = timeLeft
                timeLeft--
                console.log(timeLeft)
                if (timeLeft < 0) {
                    clearInterval(countdown)
                    obj = document.getElementById('butt')
                    obj.classList.remove('disabled-link')
                }
            }, 1000)
        }


    }
    Startcount()

</script>

</html>

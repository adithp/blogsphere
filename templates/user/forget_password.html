{% extends 'blog/base.html' %}


{% block bodycontent %}

<body class="font-display">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark p-4 group/design-root"
        style='font-family: Poppins, "Noto Sans", sans-serif;'>
        <div
            class="flex w-full max-w-md flex-col items-center gap-6 rounded-xl border border-slate-200/50 bg-surface-light p-6 shadow-sm dark:border-slate-800 dark:bg-surface-dark sm:p-8">
            <!-- PageHeading Component -->
            <div class="flex w-full flex-col items-center gap-2 text-center">
                <h1
                    class="text-text-primary-light dark:text-text-primary-dark text-3xl font-bold leading-tight tracking-tight sm:text-4xl">
                    Forgot Password?</h1>
                <p class="text-text-secondary-light dark:text-text-secondary-dark text-base font-normal leading-normal">
                    Enter your registered email, we’ll send a reset link or OTP.</p>
            </div>
            <!-- Form Container -->
            <form class="flex w-full flex-col gap-6" method="POST" action="">
                <!-- TextField Component -->
                {% csrf_token %}
                <label class="flex flex-col w-full">
                    <p
                        class="text-text-primary-light dark:text-text-primary-dark text-sm font-medium leading-normal pb-2">
                        Email Address</p>
                    <div class="flex w-full flex-1 items-stretch rounded-lg">
                        <div
                            class="text-text-secondary-light dark:text-text-secondary-dark flex items-center justify-center pl-4 pr-3 border border-r-0 border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded-l-lg">
                            <span class="material-symbols-outlined text-xl">mail</span>
                        </div>
                        <input
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-lg border border-l-0 border-slate-300 bg-slate-50 p-3.5 text-base font-normal leading-normal text-text-primary-light placeholder:text-text-secondary-light focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800 dark:text-text-primary-dark dark:placeholder:text-text-secondary-dark dark:focus:border-primary"
                            placeholder="Enter your email" type="email" value="" name="email" required />
                    </div>
                    {% if error %}
                    <h5 style="color: red;margin-top:12px">{{error}}</h5>
                    {% endif %}
                </label>
                <!-- SingleButton Component -->
                <button
                    class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 w-full bg-primary text-slate-50 text-base font-bold leading-normal tracking-[0.015em] transition-all hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-primary/40">
                    <span class="truncate">Send Reset Link</span>
                </button>
            </form>
            <!-- Success Message Placeholder -->
            <div
                class="flex hidden w-full items-center gap-3 rounded-lg bg-green-100 p-4 text-green-800 dark:bg-green-900/30 dark:text-green-300">
                <span class="material-symbols-outlined">task_alt</span>
                <p class="text-sm font-medium">Check your inbox for the reset link. It may take a few minutes.</p>
            </div>
            <!-- MetaText Component -->
            <a class="text-primary hover:text-blue-600 dark:hover:text-blue-400 text-sm font-medium leading-normal underline transition-colors"
                href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</body>
{% endblock bodycontent %}

{% extends 'blog/base.html' %}
{% block bodycontent %}


<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            {% include 'blog/header.html' %}
            <main class="flex flex-1 justify-center py-8 sm:py-12 px-4">
                <div class="w-full max-w-4xl">
                    <div
                        class="bg-white dark:bg-slate-900/70 p-6 sm:p-8 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col gap-8">
                        <div class="flex flex-wrap justify-between gap-3 p-0">
                            <p
                                class="text-slate-900 dark:text-slate-50 text-3xl sm:text-4xl font-black leading-tight tracking-[-0.033em] min-w-72">
                                Create a New Post</p>
                        </div>
                        <form class="flex flex-col gap-6" method="POST" action="" enctype="multipart/form-data">
                            {% csrf_token %}
                            {{form.errors}}
                            <div class="flex flex-col gap-2">
                                <label class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal"
                                    for="post-title">Post Title</label>
                                {{form.title}}

                            </div>

                            <div class="file-upload flex flex-col items-start gap-2 mt-4">
                                <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
                                    Thumbnail Image
                                </label>

                                <!-- Existing Image (only shows in edit mode) -->
                                {% if form.instance.thumbnail %}
                                <div class="mt-2">
                                    <p class="text-sm text-slate-500 mb-1">Current Image:</p>
                                    <img src="{{ form.instance.thumbnail.url }}" alt="Current thumbnail"
                                        class="rounded-xl shadow max-h-48 object-contain border border-slate-300 dark:border-slate-700 mb-3"
                                        id="currentImage">
                                </div>
                                {% endif %}

                                <!-- File Upload Input -->
                                <label for="fileInput"
                                    class="upload-label w-72 h-36 flex flex-col items-center justify-center border-2 border-dashed rounded-2xl cursor-pointer bg-slate-50 dark:bg-slate-800 hover:border-indigo-500 hover:text-indigo-500 transition-all duration-300">
                                    {{ form.thumbnail }}
                                    <div
                                        class="upload-box flex flex-col items-center text-slate-600 dark:text-slate-300">
                                        <span class="material-symbols-outlined text-4xl mb-1">upload</span>
                                        <p class="text-sm">Click or drag file to upload</p>
                                    </div>
                                </label>

                                <p id="fileName" class="file-name text-sm text-slate-500">No file chosen</p>
                                <img id="preview" class="hidden mt-3 rounded-xl shadow max-h-48 object-contain"
                                    alt="preview" />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal"
                                    for="post-content">Content</label>
                                <div class="flex flex-col min-w-40 h-full flex-1">
                                    {{form.media}}
                                    {{form.content}}


                                </div>

                                <div class="mb-4">
                                    <label for="category"
                                        class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                                    <select id="category" name="category" class="w-full">
                                        {% for cat in categories %}
                                        <option value="{{ cat.title }}">{{ cat.title }}</option>
                                        {% endfor %}
                                    </select>
                                </div>


                            </div>
                    </div>
                    <div
                        class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
                        <button
                            class="w-full sm:w-auto flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 flex-1 sm:flex-none bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 text-sm font-bold leading-normal tracking-[0.015em] border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                            type="button">
                            <span class="truncate">Save as Draft</span>
                        </button>
                        <button
                            class="w-full sm:w-auto flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-6 flex-1 sm:flex-none bg-primary text-slate-50 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors"
                            type="submit">
                            <span class="truncate">Publish Post</span>
                        </button>
                    </div>
                    </form>

                </div>
        </div>
        </main>
    </div>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const preview = document.getElementById('preview');
        const currentImage = document.getElementById('currentImage'); // new line

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = file.name;

                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        preview.src = event.target.result;
                        preview.classList.remove('hidden');

                        // hide old image when a new one is selected
                        if (currentImage) currentImage.classList.add('hidden');
                    };
                    reader.readAsDataURL(file);
                } else {
                    preview.classList.add('hidden');
                }
            } else {
                fileName.textContent = 'No file chosen';
                preview.classList.add('hidden');
            }
        });

        $(document).ready(function () {
            $('#category').select2({
                tags: true,  // enables typing new options
                placeholder: 'Select or type a category',
                allowClear: true,
                width: '100%'
            });
        });


    </script>
</body>

{% endblock bodycontent %}
